<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c1420" />
    <meta
      name="description"
      content="A two-player math adventure. Roll three dice, forge an expression, and race your knight to the dragon. Play together on one device."
    />
    <title>Knight’s Path · A Math Adventure</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./assets/crest.jpg" type="image/jpeg" />
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#turn-panel">Skip to turn controls</a>
    <div id="app"></div>
    <div
      id="announcer"
      class="sr-only"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <noscript
      ><main class="noscript">
        <h1>Knight’s Path</h1>
        <p>
          This game needs JavaScript to roll dice and verify your expressions.
          Enable JavaScript to play.
        </p>
      </main></noscript
    >
  </body>
</html>
